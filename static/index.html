<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>羽毛球球局筛选</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 -apple-system, "PingFang SC", sans-serif; color: #222; background: #f5f6f8; }
  header { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; padding: 10px 16px; background: #fff; border-bottom: 1px solid #ddd; }
  header.bad { background: #fde8e8; }
  header label { margin-right: 6px; }
  button { cursor: pointer; padding: 4px 12px; }
  #banner { padding: 8px 16px; background: #fff3cd; display: none; }
  #addr { display: none; padding: 10px 16px; background: #fafafa; border-bottom: 1px solid #ddd; }
  #addr div { margin: 4px 0; }
  #addr input { width: 360px; }
  .err { color: #c00; }
  .ok { color: #070; }
  main { display: flex; gap: 16px; padding: 16px; align-items: flex-start; }
  aside { width: 260px; flex: none; background: #fff; padding: 12px; border-radius: 6px; }
  aside .f { margin-bottom: 10px; }
  aside .f > span { display: block; color: #666; font-size: 12px; }
  aside input[type=number] { width: 70px; }
  aside input[type=text] { width: 100%; }
  section { flex: 1; min-width: 0; background: #fff; border-radius: 6px; padding: 8px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 6px 8px; border-bottom: 1px solid #eee; text-align: left; vertical-align: top; }
  th.s { cursor: pointer; user-select: none; }
  th.s:hover { background: #eef; }
  tr.row { cursor: pointer; }
  tr.row:hover { background: #f7faff; }
  tr.detail td { background: #fafafa; color: #444; white-space: pre-wrap; }
  .tag { display: inline-block; padding: 0 6px; margin: 0 3px 2px 0; background: #e8eefc; border-radius: 8px; font-size: 12px; }
  .src { font-size: 12px; padding: 0 6px; border-radius: 3px; background: #ddd; }
  .muted { color: #999; }
  aside select { width: 100%; }
  .chipbox { border: 1px solid #ccc; border-radius: 6px; padding: 2px 4px; display: flex;
    flex-wrap: wrap; gap: 3px; position: relative; min-height: 28px; align-items: center; cursor: text; background: #fff; }
  .chip { background: #e0e7ff; border-radius: 10px; padding: 1px 6px; font-size: 12px;
    display: inline-flex; align-items: center; gap: 4px; }
  .chip b { cursor: pointer; color: #888; font-weight: normal; }
  .chipbox input { border: none; outline: none; flex: 1; min-width: 50px; font-size: 13px; background: transparent; }
  .dd { position: absolute; top: 100%; left: 0; right: 0; margin-top: 2px; background: #fff;
    border: 1px solid #ccc; border-radius: 6px; max-height: 200px; overflow: auto; z-index: 10;
    box-shadow: 0 2px 8px rgba(0,0,0,.15); }
  .dd div { padding: 4px 8px; cursor: pointer; font-size: 13px; }
  .dd div:hover { background: #eef; }
</style>
</head>
<body>
<header id="top">
  <span>出发地
    <label><input type="radio" name="origin" value="home" checked>家</label>
    <label><input type="radio" name="origin" value="company">公司</label>
  </span>
  <span>通勤方式
    <label><input type="radio" name="mode" value="drive_min" checked>驾车</label>
    <label><input type="radio" name="mode" value="transit_min">公交</label>
  </span>
  <label>排序
    <select id="sortBy">
      <option value="start_time">开始时间</option>
      <option value="commute">通勤</option>
      <option value="price">价格</option>
      <option value="open">剩余空位</option>
      <option value="applied">已报名</option>
    </select>
  </label>
  <button id="addrBtn">设置地址</button>
  <button id="refreshBtn">刷新球局</button>
  <button id="commuteBtn">算通勤</button>
  <button id="capBtn" style="display:none">抓取凭证</button>
  <span id="status"></span>
</header>
<div id="banner">请先在『设置地址』填家和公司地址</div>
<div id="addr">
  <div>家地址 <input id="addrHome" type="text"> <span id="msgHome"></span></div>
  <div>公司地址 <input id="addrCompany" type="text"> <span id="msgCompany"></span></div>
  <div><button id="addrSave">保存</button></div>
</div>
<main>
  <aside id="form">
    <div class="f"><span>日期</span><select id="date">
      <option value="">不限</option><option value="0">今天</option>
      <option value="1">明天</option><option value="2">后天</option></select></div>
    <div class="f"><span>开始时间</span><select id="timeBucket">
      <option value="">不限</option><option value="360,600">早上 6–10 点</option>
      <option value="600,840">上午 10–下午 2 点</option><option value="840,1080">下午 2–6 点</option>
      <option value="1080,1320">晚上 6–10 点</option></select></div>
    <div class="f"><span>时长</span><select id="dur">
      <option value="">不限</option><option value="60,120">1小时</option>
      <option value="120,180">2小时</option><option value="180,240">3小时</option>
      <option value="240,">4小时及以上</option></select></div>
    <div class="f"><span>通勤上限（分钟，按当前出发地/方式）</span><input type="number" id="commuteMax" min="0">
      <label><input type="checkbox" id="unkCommute">含通勤未知</label></div>
    <div class="f"><span>价格上限</span><input type="number" id="priceMax" min="0"></div>
    <div class="f"><span>已报名范围（上下限可相同=精确）</span><input type="number" id="apMin" min="0"> ~ <input type="number" id="apMax" min="0"></div>
    <div class="f"><span>总人数范围（上下限可相同=精确）</span><input type="number" id="toMin" min="0"> ~ <input type="number" id="toMax" min="0"></div>
    <div class="f"><label><input type="checkbox" id="onlyOpen">只看还有空位</label></div>
    <div class="f"><span>场馆只看</span><div class="chipbox" id="venueInc"></div></div>
    <div class="f"><span>场馆不看</span><div class="chipbox" id="venueExc"></div></div>
    <div class="f"><span>关键字只找</span><div class="chipbox" id="kwInc"></div></div>
    <div class="f"><span>关键字排除</span><div class="chipbox" id="kwExc"></div></div>
  </aside>
  <section>
    <div id="count" class="muted"></div>
    <table>
      <thead><tr>
        <th class="s" data-sort="start_time">时间</th><th>时长</th><th>场馆</th><th>俱乐部</th>
        <th class="s" data-sort="commute">通勤</th><th class="s" data-sort="price">价格</th>
        <th class="s" data-sort="applied">报名</th><th>来源</th><th>标签</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </section>
</main>

<script src="filters.js"></script>
<script>
window._games = [];
const $ = (id) => document.getElementById(id);
const SRC = { zhongyulian: "中羽联", flashx: "闪动" };
const radio = (name) => document.querySelector(`input[name=${name}]:checked`).value;
const num = (id) => ($(id).value === "" ? null : Number($(id).value));
const range = (a, b) => (num(a) == null && num(b) == null ? null : [num(a) ?? 0, num(b) ?? Infinity]);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// 日期：今天偏移 off 天 → 本地 "YYYY-MM-DD"
const dateForOffset = (off) => { const d = new Date(); d.setDate(d.getDate() + off);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };

// 胶囊输入控件：从下拉选项点选成胶囊；allowNew 时可打字回车加新词
function makeChips(boxId, getOptions, { allowNew = false, onChange = () => {} } = {}) {
  const box = $(boxId), vals = [];
  const input = document.createElement("input");
  const dd = document.createElement("div"); dd.className = "dd"; dd.style.display = "none";
  box.append(input, dd);
  const renderChips = () => {
    [...box.querySelectorAll(".chip")].forEach((e) => e.remove());
    vals.forEach((v, i) => {
      const c = document.createElement("span"); c.className = "chip"; c.textContent = v;
      const x = document.createElement("b"); x.textContent = "×";
      x.onclick = (e) => { e.stopPropagation(); vals.splice(i, 1); renderChips(); onChange(); };
      c.appendChild(x); box.insertBefore(c, input);
    });
  };
  const add = (v) => { v = v.trim(); if (v && !vals.includes(v)) { vals.push(v); renderChips(); onChange(); } input.value = ""; showDD(); };
  const showDD = () => {
    const q = input.value.trim();
    let opts = getOptions().filter((o) => !vals.includes(o) && (!q || o.includes(q)));
    dd.innerHTML = "";
    if (allowNew && q && !opts.includes(q) && !vals.includes(q)) {
      const it = document.createElement("div"); it.textContent = `＋ 新增「${q}」`;
      it.onmousedown = (e) => { e.preventDefault(); add(q); }; dd.appendChild(it);
    }
    opts.slice(0, 50).forEach((o) => {
      const it = document.createElement("div"); it.textContent = o;
      it.onmousedown = (e) => { e.preventDefault(); add(o); }; dd.appendChild(it);
    });
    dd.style.display = dd.children.length ? "block" : "none";
  };
  input.addEventListener("focus", showDD);
  input.addEventListener("input", showDD);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && allowNew && input.value.trim()) { e.preventDefault(); add(input.value); }
    else if (e.key === "Backspace" && !input.value && vals.length) { vals.pop(); renderChips(); onChange(); showDD(); }
  });
  box.addEventListener("click", () => input.focus());
  document.addEventListener("click", (e) => { if (!box.contains(e.target)) dd.style.display = "none"; });
  return { values: () => vals.slice(), set: (arr) => { vals.length = 0; (arr || []).forEach((v) => { if (v && !vals.includes(v)) vals.push(v); }); renderChips(); } };
}
let venueIncC, venueExcC, kwIncC, kwExcC;
const kwSeen = new Set();  // 用过的关键字（下拉候选）

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error(`${path} ${r.status}`);  // 否则 500 时 r.json() 抛，页面静默卡死
  return r.json();
}

// 读表单拼 criteria
function buildCriteria() {
  const dv = $("date").value;
  const [tMin, tMax] = $("timeBucket").value ? $("timeBucket").value.split(",").map(Number) : [null, null];
  const db = $("dur").value;  // "min,max"（"240," 表示 max=∞）
  const durRange = db ? (([a, b]) => [Number(a), b === "" ? Infinity : Number(b)])(db.split(",")) : null;
  return {
    date: dv === "" ? null : dateForOffset(Number(dv)),
    startMin: tMin, startMax: tMax,
    durRange: durRange,
    origin: radio("origin"), mode: radio("mode"),
    commuteMax: num("commuteMax"), includeUnknownCommute: $("unkCommute").checked,
    venueInclude: venueIncC.values(), venueExclude: venueExcC.values(),
    priceMax: num("priceMax"),
    appliedRange: range("apMin", "apMax"), totalRange: range("toMin", "toMax"),
    onlyOpen: $("onlyOpen").checked,
    kwInclude: kwIncC.values(), kwExclude: kwExcC.values(),
  };
}

// tags 格式不定：JSON 数组 → 标签；其它非空字符串 → 单个标签；空/异常 → 无
function parseTags(t) {
  if (!t) return [];
  try {
    const v = JSON.parse(t);
    if (Array.isArray(v)) return v.map(String).filter(Boolean);
    if (typeof v === "string" && v) return [v];
    return [];
  } catch (e) { return [String(t)]; }
}

const fmtWalk = (m) => m == null ? "未知" : (m < 1000 ? m + "m" : (m / 1000).toFixed(1) + "km");
const fmtDur = (m) => m == null ? "—" : (Number.isInteger(m / 60) ? m / 60 : (m / 60).toFixed(1)) + "小时";
const fmtCommute = (c) => {
  if (!c) return "未知";
  const d = c.drive_min, t = c.transit_min;
  return `驾${d == null ? "未知" : d + "分"} / 公${t == null ? "未知" : t + "分"} / 步${fmtWalk(c.walk_m)}`;
};

function rowHtml(g, origin) {
  const venue = esc(g.venue_name || "") + (g.canonical_name ? `<br><span class="muted">${esc(g.canonical_name)}</span>` : "");
  const tags = parseTags(g.tags).map((t) => `<span class="tag">${esc(t)}</span>`).join("");
  return `<tr class="row"><td>${esc(g.date)}<br>${esc(g.start_time)}~${esc(g.end_time)}</td>
    <td>${fmtDur(g.duration_min)}</td><td>${venue}</td><td>${esc(g.club_name || "—")}</td>
    <td>${fmtCommute(g.commute?.[origin])}</td><td>${g.price == null ? "—" : esc(g.price)}</td>
    <td>${esc(g.applied_num)}/${esc(g.total_num)}</td>
    <td><span class="src">${esc(SRC[g.source] || g.source)}</span></td><td>${tags}</td></tr>
    <tr class="detail" style="display:none"><td colspan="9">${esc(g.raw_text || "（无原文）")}
组织者：${esc(g.organizer || "—")}　俱乐部：${esc(g.club_name || "—")}
来源：${esc(SRC[g.source] || g.source)}　id：${esc(g.detail_ref || g.source_id || "—")}（供回原小程序手动查）</td></tr>`;
}

function render() {
  const c = buildCriteria();
  const rows = sortGames(applyFilters(window._games, c), $("sortBy").value, c.origin, c.mode);
  $("tbody").innerHTML = rows.map((g) => rowHtml(g, c.origin)).join("");
  $("count").textContent = `共 ${rows.length} / ${window._games.length} 场`;
}

async function loadGames() {
  window._games = (await api("/api/games")).games;
  render();
}

function applyOrigins(o) {
  $("addrHome").value = o.home?.address || "";
  $("addrCompany").value = o.company?.address || "";
  $("banner").style.display = !o.home?.has_coord && !o.company?.has_coord ? "block" : "none";
}

// 场馆下拉候选：库里出现过的馆名 + 统一名；关键字下拉候选：用过的词 + 球局标签
const venueOptions = () => [...new Set(window._games.flatMap((g) => [g.venue_name, g.canonical_name]).filter(Boolean))].sort((a, b) => a.localeCompare(b, "zh"));
const kwOptions = () => [...new Set([...kwSeen, ...window._games.flatMap((g) => parseTags(g.tags))])].sort((a, b) => a.localeCompare(b, "zh"));
function saveKeywords() {
  api("/api/keywords", { include: kwIncC.values(), exclude: kwExcC.values() })
    .catch((e) => { $("status").textContent = "关键字保存失败：" + e; });
}

async function init() {
  const [cfg, org] = await Promise.all([api("/api/config"), api("/api/origins")]);
  venueIncC = makeChips("venueInc", venueOptions, { onChange: render });
  venueExcC = makeChips("venueExc", venueOptions, { onChange: render });
  const kwChanged = () => { [...kwIncC.values(), ...kwExcC.values()].forEach((v) => kwSeen.add(v)); render(); saveKeywords(); };
  kwIncC = makeChips("kwInc", kwOptions, { allowNew: true, onChange: kwChanged });
  kwExcC = makeChips("kwExc", kwOptions, { allowNew: true, onChange: kwChanged });
  (cfg.keywords?.include || []).concat(cfg.keywords?.exclude || []).forEach((v) => kwSeen.add(v));
  kwIncC.set(cfg.keywords?.include || []);
  kwExcC.set(cfg.keywords?.exclude || []);
  applyOrigins(org);
  await loadGames();
  // 刷新网页时若后台拉取/通勤还在跑，恢复进度显示并禁用对应按钮
  try {
    const [cs, rs] = await Promise.all([api("/api/commute/status"), api("/api/refresh/status")]);
    if (cs.computing) { $("commuteBtn").disabled = true; pollCommute(); }
    if (rs.refreshing) { $("refreshBtn").disabled = true; pollRefresh(); }
  } catch (e) { /* 状态查不到不影响主流程 */ }
}

// 筛选控件、出发地、方式、排序：改动即重渲染（场馆/关键字胶囊通过各自 onChange 触发；关键字另存库）
document.querySelectorAll("#form input, #form select, header input, #sortBy").forEach((el) => {
  el.addEventListener("input", render);
  el.addEventListener("change", render);
});
document.querySelectorAll("th.s").forEach((th) => th.addEventListener("click", () => { $("sortBy").value = th.dataset.sort; render(); }));
$("tbody").addEventListener("click", (e) => {
  const tr = e.target.closest("tr.row");
  if (tr) { const d = tr.nextElementSibling; d.style.display = d.style.display === "none" ? "" : "none"; }
});
$("addrBtn").onclick = () => { const a = $("addr"); a.style.display = a.style.display === "block" ? "none" : "block"; };

$("addrSave").onclick = async () => {
  try {
    const r = await api("/api/origins", { home: $("addrHome").value, company: $("addrCompany").value });
    let changed = false;
    for (const [k, id] of [["home", "msgHome"], ["company", "msgCompany"]]) {
      const x = r[k] || {};
      $(id).className = x.ok ? "ok" : "err";
      $(id).textContent = x.ok ? "已保存" : (x.msg || "保存失败");
      if (x.ok && x.changed) changed = true;
    }
    applyOrigins(await api("/api/origins"));
    if (changed) { await loadGames(); startCompute("地址已更新"); }  // 地址变→重算通勤
  } catch (e) { $("msgHome").className = "err"; $("msgHome").textContent = "保存失败：" + e; }
};

let _pollTimer = null;
// 通勤在后台算：每 5s 查进度，有新结果就重渲染列表；算完停
function pollCommute(baseMsg) {
  if (_pollTimer) clearTimeout(_pollTimer);
  const pre = baseMsg ? baseMsg + "　" : "";
  let last = -1;
  const tick = async () => {
    let s;
    try { s = await api("/api/commute/status"); }
    catch { _pollTimer = setTimeout(tick, 5000); return; }
    if (s.commute_places !== last) { last = s.commute_places; await loadGames(); }
    if (s.computing) {
      $("status").textContent = `${pre}通勤后台计算中…（已算 ${s.commute_places}）`;
      _pollTimer = setTimeout(tick, 5000);
    } else {
      await loadGames();
      $("status").textContent = (s.pending > 0)
        ? `${pre}还有 ${s.pending} 个场馆通勤没算出（可能高德繁忙），再点「算通勤」重试`
        : `${pre}通勤已算完（${s.commute_places}）`;
      $("commuteBtn").disabled = false;  // 通勤算完才放开按钮
    }
  };
  tick();
}

// 只重新拉取球局入库（后台线程，不阻塞服务器），不算通勤
let _refreshTimer = null;
function pollRefresh() {
  if (_refreshTimer) clearTimeout(_refreshTimer);
  const tick = async () => {
    let s;
    try { s = await api("/api/refresh/status"); }
    catch { _refreshTimer = setTimeout(tick, 2000); return; }
    if (s.refreshing) {
      $("status").textContent = "刷新球局中…（后台重新拉取两平台）";
      _refreshTimer = setTimeout(tick, 2000);
    } else {
      const r = s.result || {};
      const failed = r.auth_failed || [];
      $("top").classList.toggle("bad", failed.length > 0);
      $("capBtn").style.display = failed.length ? "" : "none";
      let msg = `已拉取 ${r.count ?? 0} 场`;
      if (failed.length) msg = `凭证失效：${failed.map((p) => SRC[p] || p).join("、")}（点「抓取凭证」）`;
      if ((r.errors || []).length) msg += `；网络失败：${r.errors.map((e) => typeof e === "string" ? e : JSON.stringify(e)).join("；")}`;
      else msg += "（新球馆的通勤点「算通勤」计算）";
      $("status").textContent = msg;
      await loadGames();
      $("refreshBtn").disabled = false;
    }
  };
  tick();
}
$("refreshBtn").onclick = async () => {
  $("refreshBtn").disabled = true;
  $("status").textContent = "刷新球局中…";
  $("status").className = "";
  try {
    await api("/api/refresh", {});
    pollRefresh();
  } catch (e) { $("status").textContent = "刷新失败：" + e; $("refreshBtn").disabled = false; }
};

// 单独触发后台算通勤（慢、耗高德额度）；已算过的走缓存只补缺失
async function startCompute(baseMsg) {
  $("commuteBtn").disabled = true;
  try {
    const r = await api("/api/commute", {});
    if (r.computing) pollCommute(baseMsg);
    else { $("status").textContent = "通勤无需计算"; $("commuteBtn").disabled = false; }
  } catch (e) { $("status").textContent = "算通勤失败：" + e; $("commuteBtn").disabled = false; }
}
$("commuteBtn").onclick = () => startCompute("");

$("capBtn").onclick = async () => {
  $("status").textContent = "抓取中：请打开对应小程序刷一下；若抓不到先关 VPN/sing-box…";
  try {
    const r = await api("/api/creds/capture", {});
    const got = Object.keys(r).filter((k) => r[k]).map((k) => SRC[k] || k);
    $("status").textContent = (got.length ? `已拿到新凭证：${got.join("、")}。` : "没抓到凭证。") + "请重新点「刷新球局」。";
  } catch (e) { $("status").textContent = "抓取失败：" + e; }
};

init().catch((e) => { $("status").textContent = "加载失败：" + e + "（确认后端已启动）"; });
</script>
</body>
</html>
