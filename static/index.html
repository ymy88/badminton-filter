<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>羽毛球球局筛选</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/static/app.css">
<style>
  /* 本页布局；颜色/圆角引用 app.css 的变量 */
  header { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; padding: 10px 16px;
    background: var(--c-surface); border-bottom: 1px solid var(--c-line); }
  header.bad { background: var(--c-bad-bg); }
  header label { margin-right: 8px; }
  header .sep { flex: 1; }
  #banner { padding: 8px 16px; background: var(--c-warn-bg); display: none; }
  #addr { display: none; padding: 10px 16px; background: var(--c-surface-2); border-bottom: 1px solid var(--c-line); }
  .orow { display: flex; gap: 8px; align-items: center; margin: 4px 0; }
  .orow .oname { width: 140px; }
  .opick { margin: 4px 0 10px; }
  .opick:empty { display: none; }
  main { padding: 16px; }
  aside { padding: 4px 14px; margin-bottom: 16px; }
  .grp { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: flex-end; padding: 10px 0; }
  .grp + .grp { border-top: 1px solid var(--c-line); }
  aside .f { margin: 0; min-width: 0; }
  aside .f > span { display: block; color: var(--c-muted); font-size: var(--fs-sm); margin-bottom: 2px; }
  aside .f > label { display: flex; align-items: center; height: 28px; font-size: 13px; }
  aside input[type=number] { width: 72px; }
  aside select { min-width: 130px; }
  section { padding: 8px; overflow-x: auto; }
  #count { padding: 2px 8px 6px; }
  th.s { cursor: pointer; user-select: none; }
  th.s:hover, th.s.on { color: var(--c-primary); }
  th.s.on::after { content: " ↑"; }  /* 当前排序列：升序 ↑ / 降序 ↓ */
  th.s.on.desc::after { content: " ↓"; }
  tr.row { cursor: pointer; }
  tr.row:hover { background: var(--c-hover); }
  tr.detail td { background: var(--c-surface-2); color: #444; white-space: pre-wrap; }
  .src { font-size: var(--fs-sm); padding: 0 6px; border-radius: 3px; white-space: nowrap; }
  .src.zhongyulian { background: #fdeee0; color: #b25b12; }
  .src.flashx { background: #e3f4ea; color: #1d7a45; }
  .help { cursor: pointer; display: inline-flex; width: 15px; height: 15px; border-radius: 50%; background: var(--c-muted);
    color: #fff; font-size: 11px; font-weight: bold; align-items: center; justify-content: center; vertical-align: 1px; }
  .helpwrap { position: relative; display: inline-block; }
  .pop { display: none; position: absolute; top: 120%; left: 0; z-index: 20; background: #333; color: #fff;
    padding: 6px 9px; border-radius: 4px; font-size: var(--fs-sm); font-weight: normal; white-space: nowrap; box-shadow: var(--shadow); }
  .pop.show { display: block; }
</style>
</head>
<body>
<header id="top">
  <span>当前通勤方式（排序和筛选）
    <label><input type="radio" name="mode" value="drive_min" checked>驾车</label>
    <label><input type="radio" name="mode" value="transit_min">公交</label>
  </span>
  <a href="/venues">球馆管理</a>
  <span class="sep"></span>
  <span id="status"></span>
  <button id="addrBtn">设置地址</button>
  <button id="refreshBtn">刷新球局</button>
  <button id="commuteBtn">算通勤</button>
  <button id="capBtn" class="danger" style="display:none">抓取凭证</button>
</header>
<div id="banner">请先在『设置地址』填出发地地址</div>
<div id="addr">
  <div id="addrRows"></div>
  <div class="orow"><button id="addrAdd">+ 添加地址</button><span class="muted" id="addrCost"></span>
    <button id="addrSave" class="primary">保存</button><span id="addrMsg"></span></div>
</div>
<main>
  <aside id="form" class="card">
    <div class="grp">
      <div class="f"><span>日期</span><select id="date">
        <option value="">不限</option><option value="0">今天</option>
        <option value="1">明天</option><option value="2">后天</option></select></div>
      <div class="f"><span>开始时间</span><select id="timeBucket">
        <option value="">不限</option><option value="360,600">早上 6–10 点</option>
        <option value="600,840">上午 10–下午 2 点</option><option value="840,1080">下午 2–6 点</option>
        <option value="1080,1320">晚上 6–10 点</option></select></div>
      <div class="f"><span>时长</span><select id="dur">
        <option value="">不限</option><option value="60,120">1小时</option>
        <option value="120,180">2小时</option><option value="180,240">3小时</option>
        <option value="240,">4小时及以上</option></select></div>
      <div class="f"><span>价格上限</span><input type="number" id="priceMax" min="0"></div>
      <div class="f"><span>来源</span><select id="source">
        <option value="">不限</option><option value="zhongyulian">中羽联</option><option value="flashx">闪动</option></select></div>
    </div>
    <div class="grp">
      <div id="cmaxBox" style="display: contents"></div>
      <div class="f"><label><input type="checkbox" id="unkCommute">含通勤未知</label></div>
    </div>
    <div class="grp">
      <div class="f"><span>已报名范围（上下限可相同=精确）</span><input type="number" id="apMin" min="0"> ~ <input type="number" id="apMax" min="0"></div>
      <div class="f"><span>总人数范围（上下限可相同=精确）</span><input type="number" id="toMin" min="0"> ~ <input type="number" id="toMax" min="0"></div>
      <div class="f"><label><input type="checkbox" id="onlyOpen">只看还有空位</label></div>
    </div>
    <div class="grp">
      <div class="f"><span>场馆只看</span><div class="chipbox" id="venueInc"></div></div>
      <div class="f"><span>场馆不看</span><div class="chipbox" id="venueExc"></div></div>
      <div class="f"><span>俱乐部只看</span><div class="chipbox" id="clubInc"></div></div>
      <div class="f"><span>俱乐部不看</span><div class="chipbox" id="clubExc"></div></div>
      <div class="f"><span>关键字只找</span><div class="chipbox" id="kwInc"></div></div>
      <div class="f"><span>关键字排除</span><div class="chipbox" id="kwExc"></div></div>
    </div>
  </aside>
  <section class="card">
    <div id="count" class="muted"></div>
    <table>
      <thead><tr>
        <th class="s" data-sort="start_time">时间</th><th class="s" data-sort="duration">时长</th><th class="s" data-sort="venue">场馆 <span class="helpwrap"><span class="help" id="venueHelp">?</span><span class="pop" id="venuePop">上一行：平台读取到的名字<br>下一行：高德地图搜到的名字</span></span></th><th class="s" data-sort="club">俱乐部</th>
        <th class="s" data-sort="price">价格</th>
        <th class="s" data-sort="applied">报名</th><th class="s" data-sort="source">来源</th><th class="s" data-sort="tags">标签</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </section>
</main>

<script type="module">
import { applyFilters, sortGames, pyMatch, parseTags } from "/static/filters.js";
import { $, SRC, esc, api, PY, ensurePinyin, mapLink, locPicker } from "/static/common.js";

window._games = [];
const radio = (name) => document.querySelector(`input[name=${name}]:checked`).value;
const num = (id) => ($(id).value === "" ? null : Number($(id).value));
const range = (a, b) => (num(a) == null && num(b) == null ? null : [num(a) ?? 0, num(b) ?? Infinity]);
// 日期：今天偏移 off 天 → 本地 "YYYY-MM-DD"
const dateForOffset = (off) => { const d = new Date(); d.setDate(d.getDate() + off);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };

// 胶囊输入控件：从下拉选项点选成胶囊；allowNew 时可打字回车加新词
function makeChips(boxId, getOptions, { allowNew = false, onChange = () => {} } = {}) {
  const box = $(boxId), vals = [];
  const input = document.createElement("input");
  const dd = document.createElement("div"); dd.className = "dd"; dd.style.display = "none";
  box.append(input, dd);
  const renderChips = () => {
    [...box.querySelectorAll(".chip")].forEach((e) => e.remove());
    vals.forEach((v, i) => {
      const c = document.createElement("span"); c.className = "chip"; c.textContent = v;
      const x = document.createElement("b"); x.textContent = "×";
      x.onclick = (e) => { e.stopPropagation(); vals.splice(i, 1); renderChips(); onChange(); };
      c.appendChild(x); box.insertBefore(c, input);
    });
  };
  const add = (v) => { v = v.trim(); if (v && !vals.includes(v)) { vals.push(v); renderChips(); onChange(); } input.value = ""; showDD(); };
  const item = (label, v) => {
    const it = document.createElement("div"); it.textContent = label; it._v = v;
    it.onmousedown = (e) => { e.preventDefault(); add(v); }; dd.appendChild(it);
  };
  const showDD = () => {
    const q = input.value.trim();
    const opts = getOptions().filter((o) => !vals.includes(o) && pyMatch(o, q, PY[o]));
    dd.innerHTML = "";
    // 「新增」项：输入含中文时放最前；纯字母（多半在打拼音）时放最后，回车优先选匹配项
    const isNew = allowNew && q && !opts.includes(q) && !vals.includes(q), ascii = /^[\x00-\x7f]*$/.test(q);
    if (isNew && !ascii) item(`＋ 新增「${q}」`, q);
    opts.slice(0, 50).forEach((o) => item(o, o));
    if (isNew && ascii) item(`＋ 新增「${q}」`, q);
    dd.style.display = dd.children.length ? "block" : "none";
  };
  input.addEventListener("focus", showDD);
  input.addEventListener("input", showDD);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && input.value.trim()) { e.preventDefault(); if (dd.firstChild) add(dd.firstChild._v); }
    else if (e.key === "Backspace" && !input.value && vals.length) { vals.pop(); renderChips(); onChange(); showDD(); }
  });
  box.addEventListener("click", () => input.focus());
  document.addEventListener("click", (e) => { if (!box.contains(e.target)) dd.style.display = "none"; });
  return { values: () => vals.slice(), set: (arr) => { vals.length = 0; (arr || []).forEach((v) => { if (v && !vals.includes(v)) vals.push(v); }); renderChips(); } };
}
let origins = [];          // 出发地列表（GET /api/origins）
const shownOrigins = () => origins.filter((o) => o.show);
// 通勤上限框：data-cmax = 出发地 key
const cmaxInputs = () => [...document.querySelectorAll("[data-cmax]")];
const chips = {};          // 胶囊控件：id → 控件（id 同时是存库的字段名）
const kwSeen = new Set();  // 用过的关键字（下拉候选）

// 筛选条件整份存库，页面加载时恢复
const FIELDS = ["date", "timeBucket", "dur", "priceMax", "source", "unkCommute",
  "apMin", "apMax", "toMin", "toMax", "onlyOpen"];
let sortBy = "start_time", sortDesc = false;  // 当前排序列与方向（点表头切换，随筛选条件存库）
function formState() {
  const f = { mode: radio("mode"), sortBy, sortDesc };
  FIELDS.forEach((id) => { const el = $(id); f[id] = el.type === "checkbox" ? el.checked : el.value; });
  f.commuteMax = Object.fromEntries(cmaxInputs().map((el) => [el.dataset.cmax, el.value]));
  for (const [id, c] of Object.entries(chips)) f[id] = c.values();
  return f;
}
function applyFormState(f) {
  if (!f) return;
  FIELDS.forEach((id) => { if (id in f) { const el = $(id); if (el.type === "checkbox") el.checked = !!f[id]; else el.value = f[id]; } });
  cmaxInputs().forEach((el) => { el.value = f.commuteMax?.[el.dataset.cmax] ?? ""; });
  if (document.querySelector(`th.s[data-sort="${CSS.escape(f.sortBy || "")}"]`)) { sortBy = f.sortBy; sortDesc = !!f.sortDesc; }  // 存的列已不存在则保持默认
  const m = document.querySelector(`input[name=mode][value="${f.mode}"]`);
  if (m) m.checked = true;
  for (const [id, c] of Object.entries(chips)) c.set(f[id]);
}
let _saveTimer = null;
function saveFilters() {  // 防抖：连续输入数字只存最后一次
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(() => api("/api/filters", formState())
    .catch((e) => { $("status").textContent = "筛选条件保存失败：" + e; }), 300);
}
const onFormChange = () => { render(); saveFilters(); };

// 读表单拼 criteria
function buildCriteria() {
  const dv = $("date").value;
  const [tMin, tMax] = $("timeBucket").value ? $("timeBucket").value.split(",").map(Number) : [null, null];
  const db = $("dur").value;  // "min,max"（"240," 表示 max=∞）
  const durRange = db ? (([a, b]) => [Number(a), b === "" ? Infinity : Number(b)])(db.split(",")) : null;
  return {
    date: dv === "" ? null : dateForOffset(Number(dv)),
    startMin: tMin, startMax: tMax,
    durRange: durRange,
    mode: radio("mode"),
    commuteMax: Object.fromEntries(cmaxInputs().filter((el) => el.value !== "").map((el) => [el.dataset.cmax, Number(el.value)])),
    includeUnknownCommute: $("unkCommute").checked,
    venueInclude: chips.venueInc.values(), venueExclude: chips.venueExc.values(),
    clubInclude: chips.clubInc.values(), clubExclude: chips.clubExc.values(),
    priceMax: num("priceMax"),
    source: $("source").value || null,
    appliedRange: range("apMin", "apMax"), totalRange: range("toMin", "toMax"),
    onlyOpen: $("onlyOpen").checked,
    kwInclude: chips.kwInc.values(), kwExclude: chips.kwExc.values(),
  };
}


const fmtWalk = (m) => m == null ? "未知" : (m < 1000 ? m + "m" : (m / 1000).toFixed(1) + "km");
const fmtDur = (m) => m == null ? "—" : (Number.isInteger(m / 60) ? m / 60 : (m / 60).toFixed(1)) + "小时";
const fmtCommute = (c) => {
  if (!c) return "未知";
  const d = c.drive_min, t = c.transit_min;
  return `驾${d == null ? "未知" : d + "分"} / 公${t == null ? "未知" : t + "分"} / 步${fmtWalk(c.walk_m)}`;
};

function rowHtml(g) {
  const venue = esc(g.venue_name || "") + (g.amap_name ? `<br><span class="muted">${esc(g.amap_name)}</span>` : "");
  const tags = parseTags(g.tags).map((t) => `<span class="tag">${esc(t)}</span>`).join("");
  return `<tr class="row"><td class="nowrap">${esc(g.date)}<br>${esc(g.start_time)}~${esc(g.end_time)}</td>
    <td class="nowrap">${fmtDur(g.duration_min)}</td><td>${venue}</td><td>${esc(g.club_name || "—")}</td>
    ${shownOrigins().map((o) => `<td class="nowrap">${fmtCommute(g.commute?.[o.key])}</td>`).join("")}<td>${g.price == null ? "—" : esc(g.price)}</td>
    <td>${esc(g.applied_num)}/${esc(g.total_num)}</td>
    <td><span class="src ${esc(g.source)}">${esc(SRC[g.source] || g.source)}</span></td><td>${tags}</td></tr>
    <tr class="detail" style="display:none"><td colspan="${8 + shownOrigins().length}">${esc(g.raw_text || "（无原文）")}
${origins.length ? "通勤：" + origins.map((o) => `${esc(o.name)} ${fmtCommute(g.commute?.[o.key])}`).join("　") + "\n" : ""}组织者：${esc(g.organizer || "—")}　俱乐部：${esc(g.club_name || "—")}
回${esc(SRC[g.source] || g.source)}小程序按【${esc(g.date)} ${esc(g.start_time || "")}·${esc(g.venue_name || "")}】找这条报名；活动id ${esc(g.detail_ref || g.source_id || "—")}（仅供核对，不能直接搜）</td></tr>`;
}

function render() {
  const c = buildCriteria();
  const rows = sortGames(applyFilters(window._games, c), sortBy, c.mode, sortDesc);
  $("tbody").innerHTML = rows.map((g) => rowHtml(g)).join("");
  $("count").textContent = `共 ${rows.length} / ${window._games.length} 场`;
  document.querySelectorAll("th.s").forEach((th) => {
    th.classList.toggle("on", th.dataset.sort === sortBy);
    th.classList.toggle("desc", th.dataset.sort === sortBy && sortDesc);
  });
}

async function loadGames() {
  window._games = (await api("/api/games")).games;
  render();
  ensurePinyin([...venueOptions(), ...clubOptions(), ...kwOptions()]);
}

// 按出发地列表重建：筛选里的上限框（全部出发地）+ 表头通勤列（只「显示成列」的），保留已填的上限
function applyOrigins(list) {
  origins = list;
  const cur = Object.fromEntries(cmaxInputs().map((el) => [el.dataset.cmax, el.value]));
  $("cmaxBox").innerHTML = origins.map((o) =>
    `<div class="f"><span>${esc(o.name)}通勤上限（分钟，按当前方式）</span><input type="number" min="0" data-cmax="${esc(o.key)}"></div>`).join("");
  cmaxInputs().forEach((el) => {
    el.value = cur[el.dataset.cmax] ?? "";
    el.addEventListener("input", onFormChange);
  });
  document.querySelectorAll("th.oc").forEach((th) => th.remove());
  document.querySelector('th[data-sort="club"]').insertAdjacentHTML("afterend", shownOrigins().map((o) =>
    `<th class="s oc" data-sort="commute:${esc(o.key)}">${esc(o.name)}通勤</th>`).join(""));
  if (!document.querySelector(`th.s[data-sort="${CSS.escape(sortBy)}"]`)) { sortBy = "start_time"; sortDesc = false; }  // 排序列被删/隐藏
  $("banner").style.display = origins.some((o) => o.lat != null) ? "none" : "block";
}

// 场馆下拉候选：库里出现过的馆名 + 统一名；关键字下拉候选：用过的词 + 球局标签
const venueOptions = () => [...new Set(window._games.flatMap((g) => [g.venue_name, g.amap_name]).filter(Boolean))].sort((a, b) => a.localeCompare(b, "zh"));
const clubOptions = () => [...new Set(window._games.map((g) => g.club_name).filter(Boolean))].sort((a, b) => a.localeCompare(b, "zh"));
const kwOptions = () => [...new Set([...kwSeen, ...window._games.flatMap((g) => parseTags(g.tags))])].sort((a, b) => a.localeCompare(b, "zh"));

async function init() {
  const [cfg, org] = await Promise.all([api("/api/config"), api("/api/origins")]);
  for (const id of ["venueInc", "venueExc"]) chips[id] = makeChips(id, venueOptions, { onChange: onFormChange });
  for (const id of ["clubInc", "clubExc"]) chips[id] = makeChips(id, clubOptions, { onChange: onFormChange });
  const kwChanged = () => { [...chips.kwInc.values(), ...chips.kwExc.values()].forEach((v) => kwSeen.add(v)); onFormChange(); };
  for (const id of ["kwInc", "kwExc"]) chips[id] = makeChips(id, kwOptions, { allowNew: true, onChange: kwChanged });
  (cfg.kw_history || []).forEach((v) => kwSeen.add(v));  // 打过的词永久进下拉候选
  applyOrigins(org);  // 先建上限框和表头，才能恢复上限值和排序列
  applyFormState(cfg.filters);
  await loadGames();
  // 刷新网页时若后台拉取/通勤还在跑，恢复进度显示并禁用对应按钮
  try {
    const [cs, rs] = await Promise.all([api("/api/commute/status"), api("/api/refresh/status")]);
    if (cs.computing) { $("commuteBtn").disabled = true; pollCommute(); }
    if (rs.refreshing) { $("refreshBtn").disabled = true; pollRefresh(); }
  } catch (e) { /* 状态查不到不影响主流程 */ }
}

// 筛选控件、通勤方式：改动即重渲染并存库（胶囊控件通过各自 onChange 触发；排序见表头点击）
document.querySelectorAll("#form input, #form select, header input").forEach((el) => {
  el.addEventListener("input", onFormChange);
  el.addEventListener("change", onFormChange);
});
$("tbody").closest("table").querySelector("thead").addEventListener("click", (e) => {  // 委托：出发地列是动态插入的
  const th = e.target.closest("th.s");
  if (!th) return;
  // 点当前列切换升/降序；点别的列从升序开始
  sortDesc = th.dataset.sort === sortBy ? !sortDesc : false;
  sortBy = th.dataset.sort;
  onFormChange();
});
// 场馆列说明：点「?」图标弹/收说明，点别处收起
$("venueHelp").onclick = (e) => { e.stopPropagation(); $("venuePop").classList.toggle("show"); };
document.addEventListener("click", (e) => { if (!e.target.closest(".helpwrap")) $("venuePop").classList.remove("show"); });
$("tbody").addEventListener("click", (e) => {
  const tr = e.target.closest("tr.row");
  if (tr) { const d = tr.nextElementSibling; d.style.display = d.style.display === "none" ? "" : "none"; }
});

// ---- 出发地面板：编辑草稿 draft，点「保存」整份提交 ----
let draft = [];  // [{key?, name, address, lat, lng, show, loc?, msg?, cls?}]；loc = 改过但未保存的位置
let picking = -1;  // 正在选位置的行（同一时间只开一个选点区）
function renderAddr() {
  $("addrRows").innerHTML = draft.map((d, i) => `<div class="orow" data-i="${i}">
      <input class="oname" type="text" value="${esc(d.name)}" placeholder="名称，如 父母家">
      <span>${d.lat == null ? '<span class="muted">未定位</span>' : esc(d.address) + mapLink(d.name || "出发地", d.lat, d.lng)}${d.loc ? ' <span class="muted">（未保存）</span>' : ""}</span>
      <button data-act="loc">改位置</button>
      <label><input class="oshow" type="checkbox"${d.show ? " checked" : ""}>显示成列</label>
      <button data-act="del" class="danger">删除</button>
      <span class="${d.cls || ""}">${esc(d.msg || "")}</span></div>
    <div class="opick"></div>`).join("");
  if (picking >= 0) openPicker(picking);
}
function openPicker(i) {
  picking = i;
  document.querySelectorAll(".opick").forEach((el) => { el.innerHTML = ""; });
  const { input } = locPicker(document.querySelectorAll(".opick")[i], {
    query: draft[i].name,
    onPick: (p) => {
      const address = p.amap_id ? `${p.name}（${p.district} ${p.address}）` : `手动坐标 ${p.lng},${p.lat}`;
      Object.assign(draft[i], { loc: { address, lat: p.lat, lng: p.lng }, address, lat: p.lat, lng: p.lng, msg: "" });
      picking = -1;
      renderAddr();
    },
  });
  input.focus();
}
$("addrRows").addEventListener("input", (e) => {  // 名称、显示成列：只改草稿，不重绘（免得丢焦点）
  const d = draft[Number(e.target.closest(".orow")?.dataset.i)];
  if (!d) return;
  if (e.target.classList.contains("oname")) d.name = e.target.value;
  if (e.target.classList.contains("oshow")) d.show = e.target.checked;
});
$("addrRows").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-act]");
  if (!btn) return;
  const i = Number(btn.closest(".orow").dataset.i);
  if (btn.dataset.act === "loc") openPicker(i);
  else if (btn.dataset.act === "del") {
    if (draft[i].key && !confirm(`删除「${draft[i].name}」会一起删掉它的通勤缓存，确定？`)) return;
    draft.splice(i, 1);
    picking = -1;
    renderAddr();
  }
});
$("addrAdd").onclick = async () => {
  draft.push({ name: "", address: "", lat: null, lng: null, show: true });
  picking = draft.length - 1;
  renderAddr();
  try { $("addrCost").textContent = `新地址第一次算通勤约 ${(await api("/api/commute/status")).commute_places * 3} 次高德调用`; }
  catch (e) { /* 只是提示，查不到不影响 */ }
};
$("addrBtn").onclick = () => {
  const a = $("addr");
  if (a.style.display === "block") { a.style.display = "none"; return; }
  draft = origins.map((o) => ({ ...o }));
  picking = -1;
  $("addrMsg").textContent = "";
  renderAddr();
  a.style.display = "block";
};
$("addrSave").onclick = async () => {
  const noLoc = draft.find((d) => !d.key && !d.loc);
  if (noLoc) { $("addrMsg").className = "err"; $("addrMsg").textContent = `先给「${noLoc.name || "新地址"}」选位置`; return; }
  let res;
  try {
    res = await api("/api/origins", { origins: draft.map((d) => ({ key: d.key, name: d.name, show: d.show, ...(d.loc ? { loc: d.loc } : {}) })) });
  } catch (e) { $("addrMsg").className = "err"; $("addrMsg").textContent = "保存失败：" + e.message; return; }
  // 成功的条目记下 key、清掉未保存标记；失败的保留输入，提示原因
  res.forEach((r, i) => Object.assign(draft[i], r.ok ? { key: r.key, loc: undefined, msg: "已保存", cls: "ok" } : { msg: r.msg, cls: "err" }));
  $("addrMsg").textContent = "";
  picking = -1;
  renderAddr();
  applyOrigins(await api("/api/origins"));
  onFormChange();  // 删掉的出发地的上限从存库的筛选条件里去掉
  if (res.some((r) => r.ok && r.changed)) { await loadGames(); startCompute("地址已更新"); }  // 位置变→重算通勤
};

let _pollTimer = null;
// 通勤在后台算：每 2s 查进度，有新结果就重渲染列表；算完停
function pollCommute(baseMsg) {
  if (_pollTimer) clearTimeout(_pollTimer);
  const pre = baseMsg ? baseMsg + "　" : "";
  let last = -1;
  const tick = async () => {
    let s;
    try { s = await api("/api/commute/status"); }
    catch { _pollTimer = setTimeout(tick, 2000); return; }
    if (s.commute_places !== last) { last = s.commute_places; await loadGames(); }
    if (s.computing) {
      $("status").textContent = `${pre}通勤后台计算中… ${s.progress || "准备中"}（已有 ${s.commute_places} 个场馆的通勤）`;
      _pollTimer = setTimeout(tick, 2000);
    } else {
      await loadGames();
      $("status").textContent = ((s.pending > 0)
        ? `${pre}还有 ${s.pending} 个场馆通勤没算出（高德接口出错），再点「算通勤」重试`
        : `${pre}通勤已算完（${s.commute_places} 个场馆）`)
        + (s.unmatched > 0 ? `；${s.unmatched} 个场馆高德没自动搜到，去「球馆管理」处理` : "");
      $("commuteBtn").disabled = false;  // 通勤算完才放开按钮
    }
  };
  tick();
}

// 只重新拉取球局入库（后台线程，不阻塞服务器），不算通勤
let _refreshTimer = null;
function pollRefresh() {
  if (_refreshTimer) clearTimeout(_refreshTimer);
  const tick = async () => {
    let s;
    try { s = await api("/api/refresh/status"); }
    catch { _refreshTimer = setTimeout(tick, 2000); return; }
    if (s.refreshing) {
      $("status").textContent = `刷新球局中… ${s.progress || "准备中"}`;
      _refreshTimer = setTimeout(tick, 2000);
    } else {
      const r = s.result || {};
      const failed = r.auth_failed || [];
      $("top").classList.toggle("bad", failed.length > 0);
      $("capBtn").style.display = failed.length ? "" : "none";
      let msg = `已拉取 ${r.count ?? 0} 场`;
      if (failed.length) msg = `凭证失效：${failed.map((p) => SRC[p] || p).join("、")}（点「抓取凭证」）`;
      if ((r.errors || []).length) msg += `；网络失败：${r.errors.map((e) => typeof e === "string" ? e : JSON.stringify(e)).join("；")}`;
      else msg += "（新球馆的通勤点「算通勤」计算）";
      $("status").textContent = msg;
      await loadGames();
      $("refreshBtn").disabled = false;
    }
  };
  tick();
}
$("refreshBtn").onclick = async () => {
  if (!confirm("刷新球局要逐页拉取中羽联和闪动，可能需要十几分钟（中羽联较慢）。\n期间可以正常使用页面。是否继续？")) return;
  $("refreshBtn").disabled = true;
  $("status").textContent = "刷新球局中…";
  $("status").className = "";
  try {
    await api("/api/refresh", {});
    pollRefresh();
  } catch (e) { $("status").textContent = "刷新失败：" + e; $("refreshBtn").disabled = false; }
};

// 单独触发后台算通勤（慢、耗高德额度）；已算过的走缓存只补缺失
async function startCompute(baseMsg) {
  $("commuteBtn").disabled = true;
  try {
    const r = await api("/api/commute", {});
    if (r.computing) pollCommute(baseMsg);
    else { $("status").textContent = "通勤无需计算"; $("commuteBtn").disabled = false; }
  } catch (e) { $("status").textContent = "算通勤失败：" + e; $("commuteBtn").disabled = false; }
}
$("commuteBtn").onclick = () => {
  if (confirm("算通勤会给新场馆归类并调用高德计算通勤，可能需要几分钟，会消耗高德额度。\n已算过的场馆走缓存，不会重复计算。是否继续？")) startCompute("");
};

$("capBtn").onclick = async () => {
  $("status").textContent = "抓取中：请在桌面微信里打开对应小程序刷一下列表…";
  try {
    const r = await api("/api/creds/capture", {});
    const got = Object.keys(r).filter((k) => r[k]).map((k) => SRC[k] || k);
    $("status").textContent = (got.length ? `已拿到新凭证：${got.join("、")}。` : "没抓到凭证。") + "请重新点「刷新球局」。";
  } catch (e) { $("status").textContent = "抓取失败：" + e; }
};

init().catch((e) => { $("status").textContent = "加载失败：" + e + "（确认后端已启动）"; });
</script>
</body>
</html>
