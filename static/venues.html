<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>球馆管理</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/static/app.css">
<style>
  /* 本页布局；颜色/圆角引用 app.css 的变量 */
  header { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; padding: 10px 16px;
    background: var(--c-surface); border-bottom: 1px solid var(--c-line); }
  header h1 { font-size: 16px; margin: 0; }
  header .sep { flex: 1; }
  main { padding: 16px; }
  .bar { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; padding: 10px 14px; margin-bottom: 12px; }
  .bar label { margin-right: 10px; }
  .bar .vsep { margin-right: 10px; }
  #q { width: 260px; }
  section { padding: 8px; overflow-x: auto; }
  td.ops { white-space: nowrap; }
  td.ops button { padding: 2px 8px; font-size: 13px; margin-right: 4px; }
  .st { font-size: var(--fs-sm); padding: 1px 6px; border-radius: 3px; white-space: nowrap; background: var(--c-surface-2); }
  .st.pending, .st.suspect { background: var(--c-warn-bg); color: #8a5a00; }
  .st.confirmed, .st.manual { background: #e3f4ea; color: var(--c-ok); }
  .st.none { background: var(--c-bad-bg); color: var(--c-danger); }
  .why { display: block; font-size: var(--fs-sm); color: #8a5a00; }
  .src { font-size: var(--fs-sm); padding: 0 6px; border-radius: 3px; white-space: nowrap; margin-right: 3px; }
  .src.zhongyulian { background: #fdeee0; color: #b25b12; }
  .src.flashx { background: #e3f4ea; color: #1d7a45; }
  tr.edit td { background: var(--c-surface-2); }
  tr.done td { background: var(--c-hover); }  /* 本次操作过、可撤销的行 */
  .ed { display: flex; flex-direction: column; gap: 8px; max-width: 760px; }
  .ed .row { display: flex; gap: 8px; align-items: center; }
  .ed input { flex: 1; }
</style>
</head>
<body>
<header>
  <h1>球馆管理</h1>
  <a href="/">← 返回球局</a>
  <span class="sep"></span>
  <span id="status"></span>
</header>
<main>
  <div class="bar card">
    <span id="views"></span>
    <input id="q" type="text" placeholder="按平台馆名或高德名搜索，支持拼音">
    <button id="prune" style="margin-left: auto">清理未关联的统一球场</button>
  </div>
  <section class="card">
    <table>
      <thead><tr><th>平台馆名</th><th>来源</th><th>球局数</th><th>统一球场</th><th>状态</th><th>操作</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </section>
</main>

<script type="module">
import { pyMatch, rankCandidates } from "/static/filters.js";
import { $, SRC, esc, api, PY, ensurePinyin, mapLink, locPicker } from "/static/common.js";

let rows = [], canonicals = [];
let editing = null;  // 正在编辑的 platform_name_norm（同一时间只开一个编辑区）
// 本次打开页面后操作过的行：platform_name_norm → 最近一次操作前的状态。
// 这些行在「待处理」里不消失，带「撤销」按钮；刷新页面后清空
const undo = new Map();

// updated_at 是 SQLite datetime('now')（UTC）→ 本地时间
const localTime = (t) => new Date(t.replace(" ", "T") + "Z").toLocaleString("zh-CN", { hour12: false });
// 待处理：还有球局的未归类（球局已过期的不再归类，不催）+ 可疑的自动归类
const isTodo = (v) => (v.origin === "pending" && v.game_count > 0) || v.suspect.length > 0;
// 状态：可疑的自动归类单列一类
const LABEL = { pending: "未归类", suspect: "自动·可疑", auto: "自动", confirmed: "已确认", manual: "手动", none: "高德搜不到" };
const stKey = (v) => v.origin === "auto" && v.suspect.length ? "suspect" : v.origin;
// 顶部视图：待处理 / 全部 / 按状态
const VIEWS = [["todo", "待处理", isTodo], ["all", "全部", () => true],
  ...Object.entries(LABEL).map(([k, label]) => [k, label, (v) => stKey(v) === k])];
$("views").innerHTML = VIEWS.map(([k, label], i) =>
  `<label><input type="radio" name="view" value="${k}"${i ? "" : " checked"}>${label} <span class="muted" data-n="${k}"></span></label>`
  + (k === "all" ? '<span class="muted vsep">|</span>' : "")).join("");

function status(v) {
  if (v.origin === "pending")
    return `<span class="st pending">未归类</span><span class="why">${!v.game_count ? "已无球局，不再自动搜索"
      : v.last_search === "error" ? `高德接口出错（${esc(localTime(v.updated_at))}），下次「算通勤」自动重试`
      : v.last_search === "empty" ? "高德按平台馆名没搜到（或搜到的离闪动坐标超过 1km），请修改关键字搜索或标记搜不到"
      : v.last_search === "dup" ? "高德搜到的球场与已有统一球场重名，请手动选择"
      : "还没搜索（点主页「算通勤」）"}</span>`;
  if (v.origin === "auto" && v.suspect.length)
    return `<span class="st suspect">自动·可疑</span>${v.suspect.map((s) => `<span class="why">${esc(s)}</span>`).join("")}`;
  return `<span class="st ${v.origin}">${LABEL[v.origin]}</span>`;
}

function ops(v) {
  const b = (act, text, cls = "") => `<button data-act="${act}" class="${cls}">${text}</button>`;
  return [
    undo.has(v.platform_name_norm) ? b("undo", "撤销", "primary") : "",
    v.origin === "auto" ? b("confirm", "确认无误") : "",
    b("edit", "修改"),
    ["auto", "pending"].includes(v.origin) ? b("none", "标记搜不到") : b("reset", "恢复自动"),
  ].join("");
}

function rowHtml(v) {
  const c = v.canonical;
  return `<tr data-norm="${esc(v.platform_name_norm)}"${undo.has(v.platform_name_norm) ? ' class="done"' : ""}>
    <td>${esc(v.name)}</td>
    <td>${v.sources.map((s) => `<span class="src ${esc(s)}">${esc(SRC[s] || s)}</span>`).join("")}</td>
    <td>${v.game_count}</td>
    <td>${c ? esc(c.amap_name) + (c.manual_coord ? ' <span class="tag">手动坐标</span>' : "") + mapLink(c.amap_name, c.lat, c.lng)
      : '<span class="muted">—</span>'}</td>
    <td>${status(v)}</td>
    <td class="ops">${ops(v)}</td></tr>`;
}

function render() {
  const view = document.querySelector("input[name=view]:checked").value;
  const q = $("q").value.trim();
  const hit = (s) => s && pyMatch(s, q, PY[s]);
  const inView = VIEWS.find(([k]) => k === view)[2];
  const shown = rows.filter((v) => (inView(v) || undo.has(v.platform_name_norm)) && (!q || hit(v.name) || hit(v.canonical?.amap_name)));
  for (const [k, , f] of VIEWS) document.querySelector(`[data-n="${k}"]`).textContent = `(${rows.filter(f).length})`;
  const used = new Set(rows.map((v) => v.canonical?.id));
  const orphans = canonicals.filter((c) => !used.has(c.id)).length;
  $("prune").textContent = `清理未关联的统一球场 (${orphans})`;
  $("prune").disabled = !orphans;
  $("tbody").innerHTML = shown.map(rowHtml).join("") ||
    `<tr><td colspan="6" class="muted">${view === "todo" && !q ? "没有待处理的场馆 🎉" : "没有匹配的场馆"}</td></tr>`;
  if (editing) {  // 重绘后恢复编辑区
    const tr = document.querySelector(`tr[data-norm="${CSS.escape(editing)}"]`);
    if (tr) openEditor(tr); else editing = null;
  }
}

async function load() {
  const d = await api("/api/venues");
  rows = d.venues; canonicals = d.canonicals;
  render();
  ensurePinyin([...rows.map((v) => v.name), ...canonicals.map((c) => c.amap_name)]);
}

// ---- 编辑区：先选已有统一球场；没有合适的再搜高德或手动指定坐标 ----
function openEditor(tr) {
  document.querySelectorAll("tr.edit").forEach((e) => e.remove());
  const v = rows.find((x) => x.platform_name_norm === tr.dataset.norm);
  const norm = editing = v.platform_name_norm;
  const ed = document.createElement("tr");
  ed.className = "edit";
  ed.innerHTML = `<td colspan="6"><div class="ed"><div class="lpbox"></div>
    <div class="row"><span class="nowrap">手动坐标的名称：</span><input class="cname" type="text" value="${esc(v.name)}">
      <button data-act="close">取消</button></div></div></td>`;
  tr.after(ed);
  const showCanon = (q) => {
    const byName = new Map(canonicals.map((c) => [c.amap_name, c]));
    const hits = q ? rankCandidates(q, [...byName.keys()], PY).map((n) => byName.get(n)) : [];
    slot.innerHTML = hits.length ? `<div class="pick canon"><div class="head">已有统一球场（按名字相近程度）</div>` +
      hits.map((c) => `<div data-cid="${c.id}">${esc(c.amap_name)}${mapLink(c.amap_name, c.lat, c.lng)}</div>`).join("") + "</div>" : "";
  };
  const { input, slot } = locPicker(ed.querySelector(".lpbox"), {
    query: v.name,
    onInput: showCanon,
    onPick: (p) => {
      if (p.amap_id) return assign(norm, { poi: { amap_id: p.amap_id, name: p.name, lat: p.lat, lng: p.lng } }, p.name);
      const name = ed.querySelector(".cname").value.trim();
      if (!name) { $("status").className = "err"; $("status").textContent = "手动坐标需要名称"; return; }
      assign(norm, { coord: { name, lat: p.lat, lng: p.lng } }, name);
    },
  });
  showCanon(v.name);
  input.focus();
}

async function act(norm, path, body = {}) {
  const v = rows.find((x) => x.platform_name_norm === norm);
  const prev = { origin: v.origin, canonical_id: v.canonical?.id ?? null, last_search: v.last_search, updated_at: v.updated_at };
  try {
    const r = await api(path, { platform_name_norm: norm, ...body });
    if (path === "/api/venues/restore") undo.delete(norm); else undo.set(norm, prev);
    editing = null;
    await load();
    return r;
  } catch (e) { $("status").className = "err"; $("status").textContent = "操作失败：" + e.message; }
}

async function assign(norm, body, label) {
  const r = await act(norm, "/api/venues/assign", body);
  if (!r) return;
  $("status").className = "ok";
  $("status").textContent = `已归到「${label}」` + (r.has_commute ? "" : "；这个场馆的通勤还没算，回主页点「算通勤」");
}

$("tbody").addEventListener("click", (e) => {
  if (e.target.closest("a")) return;  // 地图链接照常打开
  const tr = e.target.closest("tr");
  const norm = tr?.dataset.norm || tr?.previousElementSibling?.dataset.norm;
  const btn = e.target.closest("button");
  const pick = e.target.closest(".canon > div[data-cid]");
  if (btn) {
    const a = btn.dataset.act;
    if (a === "edit") openEditor(tr);
    else if (a === "close") { editing = null; tr.remove(); }
    else if (a === "confirm") act(norm, "/api/venues/confirm");
    else if (a === "reset") act(norm, "/api/venues/reset");
    else if (a === "none") act(norm, "/api/venues/none");
    else if (a === "undo") act(norm, "/api/venues/restore", undo.get(norm)).then((r) => {
      if (r) { $("status").className = "ok"; $("status").textContent = "已撤销"; }
    });
  } else if (pick?.dataset.cid) {
    const c = canonicals.find((x) => x.id === Number(pick.dataset.cid));
    assign(norm, { canonical_id: c.id }, c.amap_name);
  }
});
// 换视图/搜索时关掉编辑区：否则重绘恢复编辑区会抢走搜索框焦点、清掉编辑中的内容
const rerender = () => { editing = null; render(); };
document.querySelectorAll("input[name=view]").forEach((el) => el.addEventListener("change", rerender));
$("q").addEventListener("input", rerender);
// 改归、撤销后留下的统一球场没有馆名指向它，一键删掉（连同通勤缓存）
$("prune").addEventListener("click", async () => {
  if (!confirm(`删除 ${$("prune").textContent.match(/\d+/)[0]} 个没有任何馆名关联的统一球场？\n撤销记录里还指向它们的操作将不能再撤销。`)) return;
  try {
    const r = await api("/api/venues/prune", {});
    await load();
    const ids = new Set(canonicals.map((c) => c.id));  // 撤销目标已被删的，撤销按钮去掉
    for (const [norm, prev] of undo) if (prev.canonical_id != null && !ids.has(prev.canonical_id)) undo.delete(norm);
    render();
    $("status").className = "ok";
    $("status").textContent = `已删除 ${r.deleted} 个未关联的统一球场`;
  } catch (e) { $("status").className = "err"; $("status").textContent = "清理失败：" + e.message; }
});

load().catch((e) => { $("status").className = "err"; $("status").textContent = "加载失败：" + e.message; });
</script>
</body>
</html>
